<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1620" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<script>try{var t=localStorage.getItem("tw-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>TravelWise</title>
</head>
<body class="center-page">

<main class="auth-card" id="card">
  <a class="brand" href="/"><img src="/assets/img/logo-96.png" width="36" height="36" alt=""><span>Travel<i>Wise</i></span></a>
  <h1>Processing...</h1>
  <div class="loading-spinner"></div>
  <p>Please wait while we process your request.</p>
</main>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, applyActionCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  // Your Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyBt9jM__UX3bEIpQeX-ysuXaFvAL8N5StQ",
    authDomain: "travelwise-8e959.firebaseapp.com",
    projectId: "travelwise-8e959"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const params = new URLSearchParams(window.location.search);
  const oobCode = params.get('oobCode');
  const mode = params.get('mode');

  const card = document.getElementById('card');
  const BRAND = '<a class="brand" href="/"><img src="/assets/img/logo-96.png" width="36" height="36" alt=""><span>Travel<i>Wise</i></span></a>';
  const appLink = "intent://www.travelwise.pt/#Intent;scheme=https;package=com.osw.travelwise;end";

  if (!oobCode || !mode) {
    card.innerHTML = BRAND + `
      <h1>Invalid Link</h1>
      <div class="status-icon error">✖</div>
      <p>No valid action found in the URL.</p>
      <a href="${appLink}" class="btn">Return to TravelWise</a>
    `;
  } else if (mode === 'verifyEmail') {
    document.title = "Email Verification - TravelWise";
    card.innerHTML = BRAND + `
      <h1>Verifying Your Email...</h1>
      <div class="loading-spinner"></div>
      <p>Please wait while we confirm your account.</p>
    `;
    applyActionCode(auth, oobCode)
      .then(() => {
        card.innerHTML = BRAND + `
          <h1>Email Verified 🎉</h1>
          <div class="status-icon success">✔</div>
          <p>Your email has been successfully verified. You can now log in to TravelWise.</p>
          <a href="intent:///#Intent;scheme=app;package=com.osw.travelwise;end" id="openApp" class="btn">Go to TravelWise</a>
        `;
      })
      .catch((error) => {
        card.innerHTML = BRAND + `
          <h1>Verification Failed</h1>
          <div class="status-icon error">✖</div>
          <p>We could not verify your email. This link may have expired or been used already.</p>
          <a href="intent:///#Intent;scheme=app;package=com.osw.travelwise;end" class="btn">Return to TravelWise</a>
        `;
      });
  } else if (mode === 'resetPassword') {
    document.title = "Reset Password - TravelWise";

    const fallbackTimeout = 1500;
    let appOpened = false;

    window.onload = () => {
      const start = Date.now();
      const deepLink = `intent://www.travelwise.pt/reset-password?oobCode=${oobCode}#Intent;scheme=https;package=com.osw.travelwise;end`;
      const fallbackUrl = `https://www.travelwise.pt/reset-password?oobCode=${oobCode}`;

      card.innerHTML = BRAND + `
        <h1>Open TravelWise App</h1>
        <p>Click below to open the app or continue on the web.</p>
        <a href="${deepLink}" class="btn">Open App</a><br/><br/>
        <a href="${fallbackUrl}" class="btn">Continue in Browser</a>
      `;
    }
    function showResetForm() {
      const card = document.getElementById('card');
      card.innerHTML = BRAND + `
        <h1>Reset Your Password</h1>
        <p>Set a new password for your account.</p>
        <input type="password" id="newPassword" placeholder="New password" /><br/><br/>
        <input type="password" id="confirmPassword" placeholder="Confirm password" /><br/><br/>
        <button onclick="resetPassword()">Submit</button>
        <div id="status"></div>
      `;
    }

    function resetPassword() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const status = document.getElementById('status');

      if (!newPassword || !confirmPassword) {
        status.innerText = "Please fill both fields.";
        return;
      }
      if (newPassword !== confirmPassword) {
        status.innerText = "Passwords do not match.";
        return;
      }

      // Use Firebase to confirm the password reset
      confirmPasswordReset(auth, oobCode, newPassword)
        .then(() => {
          card.innerHTML = BRAND + `
            <h1>Password Reset 🎉</h1>
            <div class="status-icon success">✔</div>
            <p>Your password has been successfully updated.</p>
            <a href="${appLink}" class="btn">Open TravelWise</a>
          `;
        })
        .catch((error) => {
          card.innerHTML = BRAND + `
            <h1>Reset Failed</h1>
            <div class="status-icon error">✖</div>
            <p>The link may have expired or is invalid.</p>
            <a href="${appLink}" class="btn">Return to TravelWise</a>
          `;
        });
    }
  } else {
    document.title = "TravelWise";

    card.innerHTML = BRAND + `
      <h1>Unknown Action</h1>
      <div class="status-icon error">✖</div>
      <p>This action is not supported.</p>
      <a href="${appLink}" class="btn">Return to TravelWise</a>
    `;
  }
</script>
</body>
</html>
