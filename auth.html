<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1620" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<script src="/assets/js/i18n.js"></script>
<script>try{var t=localStorage.getItem("tw-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>TravelWise</title>
</head>
<body class="center-page">

<main class="auth-card" id="card">
  <a class="brand" href="/"><img src="/assets/img/logo-96.png" width="36" height="36" alt=""><span>Travel<i>Wise</i></span></a>
  <h1 data-pt="A processar...">Processing...</h1>
  <div class="loading-spinner"></div>
  <p data-pt="Aguarda enquanto processamos o teu pedido.">Please wait while we process your request.</p>
  <p class="small"><button class="lang" type="button" data-lang-toggle aria-label="Versão em português">PT</button></p>
</main>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, applyActionCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  // Your Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyBt9jM__UX3bEIpQeX-ysuXaFvAL8N5StQ",
    authDomain: "travelwise-8e959.firebaseapp.com",
    projectId: "travelwise-8e959"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const params = new URLSearchParams(window.location.search);
  const oobCode = params.get('oobCode');
  const mode = params.get('mode');

  const card = document.getElementById('card');
  const BRAND = '<a class="brand" href="/"><img src="/assets/img/logo-96.png" width="36" height="36" alt=""><span>Travel<i>Wise</i></span></a>';
  const appLink = "intent://www.travelwise.pt/#Intent;scheme=https;package=com.osw.travelwise;end";

  if (!oobCode || !mode) {
    card.innerHTML = BRAND + `
      <h1>${TW.t("Invalid Link","Link inválido")}</h1>
      <div class="status-icon error">✖</div>
      <p>${TW.t("No valid action found in the URL.","Não foi encontrada nenhuma ação válida no link.")}</p>
      <a href="${appLink}" class="btn">${TW.t("Return to TravelWise","Voltar ao TravelWise")}</a>
    `;
  } else if (mode === 'verifyEmail') {
    document.title = TW.t("Email Verification", "Verificação de email") + " - TravelWise";
    card.innerHTML = BRAND + `
      <h1>${TW.t("Verifying Your Email...","A verificar o teu email...")}</h1>
      <div class="loading-spinner"></div>
      <p>${TW.t("Please wait while we confirm your account.","Aguarda enquanto confirmamos a tua conta.")}</p>
    `;
    applyActionCode(auth, oobCode)
      .then(() => {
        card.innerHTML = BRAND + `
          <h1>${TW.t("Email Verified 🎉","Email verificado 🎉")}</h1>
          <div class="status-icon success">✔</div>
          <p>${TW.t("Your email has been successfully verified. You can now log in to TravelWise.","O teu email foi verificado. Já podes iniciar sessão no TravelWise.")}</p>
          <a href="intent:///#Intent;scheme=app;package=com.osw.travelwise;end" id="openApp" class="btn">${TW.t("Go to TravelWise","Ir para o TravelWise")}</a>
        `;
      })
      .catch((error) => {
        card.innerHTML = BRAND + `
          <h1>${TW.t("Verification Failed","Falha na verificação")}</h1>
          <div class="status-icon error">✖</div>
          <p>${TW.t("We could not verify your email. This link may have expired or been used already.","Não foi possível verificar o teu email. Este link pode ter expirado ou já ter sido usado.")}</p>
          <a href="intent:///#Intent;scheme=app;package=com.osw.travelwise;end" class="btn">${TW.t("Return to TravelWise","Voltar ao TravelWise")}</a>
        `;
      });
  } else if (mode === 'resetPassword') {
    document.title = TW.t("Reset Password", "Redefinir palavra-passe") + " - TravelWise";

    const fallbackTimeout = 1500;
    let appOpened = false;

    window.onload = () => {
      const start = Date.now();
      const deepLink = `intent://www.travelwise.pt/reset-password?oobCode=${oobCode}#Intent;scheme=https;package=com.osw.travelwise;end`;
      const fallbackUrl = `https://www.travelwise.pt/reset-password?oobCode=${oobCode}`;

      card.innerHTML = BRAND + `
        <h1>${TW.t("Open TravelWise App","Abrir a app TravelWise")}</h1>
        <p>${TW.t("Click below to open the app or continue on the web.","Toca abaixo para abrir a app ou continuar no browser.")}</p>
        <a href="${deepLink}" class="btn">${TW.t("Open App","Abrir a app")}</a><br/><br/>
        <a href="${fallbackUrl}" class="btn">${TW.t("Continue in Browser","Continuar no browser")}</a>
      `;
    }
    function showResetForm() {
      const card = document.getElementById('card');
      card.innerHTML = BRAND + `
        <h1>Reset Your Password</h1>
        <p>Set a new password for your account.</p>
        <input type="password" id="newPassword" placeholder="New password" /><br/><br/>
        <input type="password" id="confirmPassword" placeholder="Confirm password" /><br/><br/>
        <button onclick="resetPassword()">Submit</button>
        <div id="status"></div>
      `;
    }

    function resetPassword() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const status = document.getElementById('status');

      if (!newPassword || !confirmPassword) {
        status.innerText = "Please fill both fields.";
        return;
      }
      if (newPassword !== confirmPassword) {
        status.innerText = "Passwords do not match.";
        return;
      }

      // Use Firebase to confirm the password reset
      confirmPasswordReset(auth, oobCode, newPassword)
        .then(() => {
          card.innerHTML = BRAND + `
            <h1>${TW.t("Password Reset 🎉","Palavra-passe redefinida 🎉")}</h1>
            <div class="status-icon success">✔</div>
            <p>${TW.t("Your password has been successfully updated.","A tua palavra-passe foi atualizada.")}</p>
            <a href="${appLink}" class="btn">${TW.t("Open TravelWise","Abrir o TravelWise")}</a>
          `;
        })
        .catch((error) => {
          card.innerHTML = BRAND + `
            <h1>${TW.t("Reset Failed","Falha ao redefinir")}</h1>
            <div class="status-icon error">✖</div>
            <p>${TW.t("The link may have expired or is invalid.","O link pode ter expirado ou ser inválido.")}</p>
            <a href="${appLink}" class="btn">${TW.t("Return to TravelWise","Voltar ao TravelWise")}</a>
          `;
        });
    }
  } else {
    document.title = "TravelWise";

    card.innerHTML = BRAND + `
      <h1>${TW.t("Unknown Action","Ação desconhecida")}</h1>
      <div class="status-icon error">✖</div>
      <p>${TW.t("This action is not supported.","Esta ação não é suportada.")}</p>
      <a href="${appLink}" class="btn">${TW.t("Return to TravelWise","Voltar ao TravelWise")}</a>
    `;
  }
</script>
</body>
</html>
