<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1620" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<script src="/assets/js/i18n.js"></script>
<script>try{var t=localStorage.getItem("tw-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>Reset Password · TravelWise</title>
</head>
<body class="center-page">

<main class="auth-card" id="card">
  <a class="brand" href="/"><img src="/assets/img/logo-96.png" width="36" height="36" alt=""><span>Travel<i>Wise</i></span></a>
  <h1 data-pt="Redefinir a palavra-passe">Reset your password</h1>
  <p data-pt="Define uma nova palavra-passe para a tua conta.">Set a new password for your account.</p>

  <div class="input-field">
    <input type="password" id="newPassword" placeholder="New password" autocomplete="new-password" />
  </div>

  <div class="input-field">
    <input type="password" id="confirmPassword" placeholder="Confirm password" autocomplete="new-password" />
  </div>

  <button id="submitBtn" data-pt="Guardar">Submit</button>
  <div id="status" role="status" aria-live="polite"></div>
<p class="small"><button class="lang" type="button" data-lang-toggle aria-label="Versão em português">PT</button></p>
</main>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // Public client values — these are the same anon/publishable key shipped in
  // the app and are safe to expose in a browser.
  const SUPABASE_URL = "https://tbhglucbesknunsqaole.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_T9SnaoQPtskJ_nKXvw2LlA_fmEnk0KC";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, detectSessionInUrl: false },
  });

  const card = document.getElementById("card");
  document.title = TW.t('Reset Password', 'Redefinir palavra-passe') + ' · TravelWise';
  document.getElementById('newPassword').placeholder = TW.t('New password', 'Nova palavra-passe');
  document.getElementById('confirmPassword').placeholder = TW.t('Confirm password', 'Confirmar palavra-passe');
  const BRAND = '<a class="brand" href="/"><img src="/assets/img/logo-96.png" width="36" height="36" alt=""><span>Travel<i>Wise</i></span></a>';
  const statusDiv = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");

  const params = new URLSearchParams(window.location.search);
  const tokenHash = params.get("token_hash");
  const type = params.get("type");

  // Must mirror the app's password rules: 8+ chars, one lower, one upper, one digit.
  const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

  if (!tokenHash || type !== "recovery") {
    card.innerHTML = BRAND + `
      <h1>${TW.t("Invalid Link","Link inválido")}</h1>
      <p>${TW.t("This password reset link is missing or invalid. Please request a new one from the TravelWise app.","Este link para redefinir a palavra-passe está em falta ou é inválido. Pede um novo na app TravelWise.")}</p>
    `;
  } else {
    submitBtn.addEventListener("click", resetPassword);
  }

  async function resetPassword() {
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!passwordRegex.test(newPassword)) {
      statusDiv.textContent =
        TW.t("Password must be at least 8 characters and include at least one lowercase letter, one uppercase letter, and one number.","A palavra-passe deve ter pelo menos 8 caracteres e incluir uma letra minúscula, uma maiúscula e um número.");
      statusDiv.className = "error";
      return;
    }

    if (newPassword !== confirmPassword) {
      statusDiv.textContent = TW.t("Passwords do not match.","As palavras-passe não coincidem.");
      statusDiv.className = "error";
      return;
    }

    submitBtn.disabled = true;
    statusDiv.textContent = TW.t("Updating…","A atualizar…");
    statusDiv.className = "";

    // 1) Exchange the recovery token_hash for a short-lived session. No PKCE
    //    verifier is needed, so this works even though the reset was started in
    //    the app on another device.
    const { error: verifyError } = await supabase.auth.verifyOtp({
      token_hash: tokenHash,
      type: "recovery",
    });

    if (verifyError) {
      submitBtn.disabled = false;
      card.innerHTML = BRAND + `
        <h1>${TW.t("Reset Failed","Não foi possível redefinir")}</h1>
        <p>${TW.t("This link may have expired or already been used. Please request a new password reset from the TravelWise app.","Este link pode ter expirado ou já ter sido usado. Pede uma nova redefinição na app TravelWise.")}</p>
      `;
      return;
    }

    // 2) With the recovery session active, set the new password.
    const { error: updateError } = await supabase.auth.updateUser({
      password: newPassword,
    });

    if (updateError) {
      submitBtn.disabled = false;
      statusDiv.textContent = updateError.message || TW.t("Could not update password. Please try again.","Não foi possível atualizar a palavra-passe. Tenta novamente.");
      statusDiv.className = "error";
      return;
    }

    await supabase.auth.signOut();
    card.innerHTML = BRAND + `
      <h1>${TW.t("Password Reset 🎉","Palavra-passe redefinida 🎉")}</h1>
      <p>${TW.t("Your password has been successfully updated. You can now sign in with your new password in the TravelWise app.","A tua palavra-passe foi atualizada. Já podes iniciar sessão com a nova palavra-passe na app TravelWise.")}</p>
    `;
  }
</script>

</body>
</html>
