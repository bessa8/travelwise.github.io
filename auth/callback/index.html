<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1620" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<script src="/assets/js/i18n.js"></script>
<script>try{var t=localStorage.getItem("tw-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>TravelWise</title>
</head>
<body class="center-page">
  <main class="auth-card">
    <a class="brand" href="/"><img src="/assets/img/logo-96.png" width="36" height="36" alt=""><span>Travel<i>Wise</i></span></a>
    <h1 id="title" data-pt="A abrir o TravelWise…">Opening TravelWise…</h1>
    <p id="message" data-pt="Se a app não abrir automaticamente, toca no botão abaixo.">If the app doesn't open automatically, tap the button below.</p>
    <a id="open" class="btn" href="#" data-pt="Abrir o TravelWise">Open TravelWise</a>
    <p class="small" data-pt="Confirma que o TravelWise está instalado neste dispositivo.">Make sure TravelWise is installed on this device.</p>
    <p class="small"><button class="lang" type="button" data-lang-toggle aria-label="Versão em português">PT</button></p>
  </main>

<script>
(function () {
  var APP_SCHEME = "travelwise://login-callback";

  // Preserve everything Supabase appended (query string + fragment).
  // PKCE flow uses ?code=…; legacy/implicit flow uses #access_token=…&type=…
  var search = window.location.search || "";
  var hash   = window.location.hash   || "";
  var deepLink = APP_SCHEME + search + hash;

  var openLink = document.getElementById("open");
  openLink.setAttribute("href", deepLink);

  // Surface explicit Supabase errors instead of silently bouncing to the app.
  var params = new URLSearchParams(
    search.replace(/^\?/, "") + "&" + hash.replace(/^#/, "")
  );
  var err = params.get("error_description") || params.get("error");
  if (err) {
    document.getElementById("title").textContent = TW.t("Couldn't complete sign-in", "Não foi possível concluir o início de sessão");
    document.getElementById("title").classList.add("err");
    document.getElementById("title").removeAttribute("data-pt");
    document.getElementById("message").removeAttribute("data-pt");
    document.getElementById("message").textContent = decodeURIComponent(err);
    return;
  }

  // Auto-attempt the deep link. Mobile browsers will prompt to open the app;
  // desktop browsers will no-op, and the user falls back to the button.
  setTimeout(function () { window.location.href = deepLink; }, 50);
})();
</script>
</body>
</html>
